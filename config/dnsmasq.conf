# Primary DNS Server (Mac 1) - Task B
# Path on macOS with Homebrew: /opt/homebrew/etc/dnsmasq.conf

# Bind to Mac 1 IP and localhost
listen-address=10.0.0.1,127.0.0.1
port=53
bind-interfaces

# Do not forward plain names without dots
domain-needed
bogus-priv

# TTL settings for Phase 2 Extension B (30 seconds)
local-ttl=30

# Map project private domains to Mac 2 (Edge Reverse Proxy / Load Balancer)
address=/app.team1.test/10.0.0.2
address=/api.team1.test/10.0.0.2
address=/team1.test/10.0.0.2
