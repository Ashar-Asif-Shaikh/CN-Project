# macOS Packet Filter (PF) Rules for Service Isolation (Phase 2 Extension C)
# Goal: Allow only the Edge Proxy (Mac 2 / 10.0.0.2) to access Backend ports 3001 & 3002.
# All other client machines attempting direct access to 3001 & 3002 are blocked.

# 1. Define Macros
edge_ip = "10.0.0.2"
backend_ports = "{ 3001, 3002 }"

# 2. Block direct incoming access to backend ports by default
block in proto tcp to any port $backend_ports

# 3. Allow only Mac 2 (Edge Proxy) to connect to backend ports
pass in proto tcp from $edge_ip to any port $backend_ports

# 4. Allow loopback internal traffic for proxy forwarding
pass in quick on lo0 proto tcp from 127.0.0.1 to 127.0.0.1 port $backend_ports
