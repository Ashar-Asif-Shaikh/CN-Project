# Standby Nginx Configuration - Phase 2 Extension E (Controlled Edge Migration)
# Simulates a new edge node (Mac 5 or Standby Edge on 10.0.0.6:8443)

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format lb_standby '$remote_addr [$time_local] "[STANDBY EDGE] $request" $status '
                          'upstream=$upstream_addr backend=$upstream_http_x_backend';
    
    access_log logs/access_standby.log lb_standby;
    error_log logs/error_standby.log notice;

    upstream backend_servers {
        server 10.0.0.3:3001 max_fails=1 fail_timeout=10s;
        server 10.0.0.4:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Edge-Node "Standby-Edge-Mac5";
            add_header X-Edge-Node "Standby-Edge-Mac5";
        }
    }
}
