# Nginx Configuration: Mac 2 (Edge Reverse Proxy + Load Balancer)
# Demonstrates: TLS Termination, Round-Robin Load Balancing, HTTP/2, Passive Health Checks

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Logging format showing upstream address and backend identifier (Task D evidence)
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr backend=$upstream_http_x_backend';
    
    access_log logs/access.log lb;
    error_log logs/error.log notice;

    # TASK D: Upstream Load Balancer Pool
    # Default algorithm: Round-Robin
    # max_fails=1 fail_timeout=10s provides passive health checks
    upstream backend_servers {
        server 10.0.0.3:3001 max_fails=1 fail_timeout=10s;  # Mac 3: Backend A
        server 10.0.0.4:3002 max_fails=1 fail_timeout=10s;  # Mac 4: Backend B
    }

    # TASK E: HTTPS / TLS Server
    server {
        # Listen on port 8443 with TLS
        listen 8443 ssl;
        server_name app.team1.test api.team1.test localhost;

        # TLS Certificate & Key
        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;

        # Modern TLS protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Task D & E: Reverse Proxy Pass to Upstream
        location / {
            proxy_pass http://backend_servers;
            
            # Forward real client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Task F: Pass through Cache-Control and ETag headers
            proxy_pass_header Cache-Control;
            proxy_pass_header ETag;

            # High Availability failover (Phase 2 Extension D)
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
