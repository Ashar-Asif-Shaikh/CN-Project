AWSTemplateFormatVersion: '2010-09-09'
Description: 'Computer Networks Project: 4-Node Cloud Architecture (Team 1) - Free Tier Eligible'

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: 'Latest Amazon Linux 2023 AMI (Auto-detected per region)'

  InstanceType:
    Type: String
    Default: 't2.micro'
    AllowedValues: ['t2.micro', 't3.micro']
    Description: 'EC2 Instance Type (Free Tier eligible)'

  KeyPairName:
    Type: String
    Default: ''
    Description: 'Optional EC2 KeyPair name for SSH access'

Conditions:
  HasKey: !Not [!Equals [!Ref KeyPairName, '']]

Resources:
  # =========================================================================
  # 1. NETWORKING: VPC, Subnet, Internet Gateway & Routing
  # =========================================================================
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: '10.0.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: 'CN-Project-VPC'

  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: 'CN-Project-IGW'

  VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.1.0/24'
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: 'CN-Project-Subnet'

  RouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: 'CN-Project-PublicRouteTable'

  PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # =========================================================================
  # 2. SECURITY GROUP (Firewall Rules)
  # =========================================================================
  SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow DNS, HTTPS Edge, Backends, SSH & ICMP Ping'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: '0.0.0.0/0'
          Description: 'SSH Access'
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: '0.0.0.0/0'
          Description: 'DNS UDP'
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: '0.0.0.0/0'
          Description: 'DNS TCP'
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: '0.0.0.0/0'
          Description: 'Edge Reverse Proxy & TLS'
        - IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          CidrIp: '0.0.0.0/0'
          Description: 'Backend Server A'
        - IpProtocol: tcp
          FromPort: 3002
          ToPort: 3002
          CidrIp: '0.0.0.0/0'
          Description: 'Backend Server B'
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: '0.0.0.0/0'
          Description: 'Ping / ICMP Echo'
      Tags:
        - Key: Name
          Value: 'CN-Project-SG'

  # =========================================================================
  # 3. EC2 INSTANCES: The 4 Machine Roles
  # =========================================================================

  # Mac 3: Backend Server A (Private IP: 10.0.1.30, Port: 3001)
  BackendAInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref Subnet
      PrivateIpAddress: '10.0.1.30'
      SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        - Key: Name
          Value: 'Mac3-Backend-A'
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y python3

          mkdir -p /opt/backend
          cat << 'EOF' > /opt/backend/backend_a.py
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json

          BACKEND_ID = "A"
          ETAG = '"backend-a-v1"'

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  inm = self.headers.get("If-None-Match")
                  if inm and inm.strip() == ETAG:
                      self.send_response(304)
                      self.send_header("X-Backend", BACKEND_ID)
                      self.send_header("Cache-Control", "max-age=60")
                      self.send_header("ETag", ETAG)
                      self.end_headers()
                      return

                  self.send_response(200)
                  self.send_header("X-Backend", BACKEND_ID)
                  self.send_header("Cache-Control", "max-age=60")
                  self.send_header("ETag", ETAG)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()

                  resp = {
                      "backend": BACKEND_ID,
                      "status": "ok",
                      "server": "EC2-Backend-A (10.0.1.30)"
                  }
                  self.wfile.write(json.dumps(resp, indent=2).encode('utf-8'))

          httpd = HTTPServer(('0.0.0.0', 3001), Handler)
          httpd.serve_forever()
          EOF

          cat << 'EOF' > /etc/systemd/system/backend-a.service
          [Unit]
          Description=Backend Server A
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/backend/backend_a.py
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now backend-a

  # Mac 4: Backend Server B (Private IP: 10.0.1.40, Port: 3002)
  BackendBInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref Subnet
      PrivateIpAddress: '10.0.1.40'
      SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        - Key: Name
          Value: 'Mac4-Backend-B'
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y python3

          mkdir -p /opt/backend
          cat << 'EOF' > /opt/backend/backend_b.py
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json

          BACKEND_ID = "B"
          ETAG = '"backend-b-v1"'

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  inm = self.headers.get("If-None-Match")
                  if inm and inm.strip() == ETAG:
                      self.send_response(304)
                      self.send_header("X-Backend", BACKEND_ID)
                      self.send_header("Cache-Control", "max-age=60")
                      self.send_header("ETag", ETAG)
                      self.end_headers()
                      return

                  self.send_response(200)
                  self.send_header("X-Backend", BACKEND_ID)
                  self.send_header("Cache-Control", "max-age=60")
                  self.send_header("ETag", ETAG)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()

                  resp = {
                      "backend": BACKEND_ID,
                      "status": "ok",
                      "server": "EC2-Backend-B (10.0.1.40)"
                  }
                  self.wfile.write(json.dumps(resp, indent=2).encode('utf-8'))

          httpd = HTTPServer(('0.0.0.0', 3002), Handler)
          httpd.serve_forever()
          EOF

          cat << 'EOF' > /etc/systemd/system/backend-b.service
          [Unit]
          Description=Backend Server B
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/backend/backend_b.py
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now backend-b

  # Mac 2: Edge Reverse Proxy & Load Balancer (Private IP: 10.0.1.20, Port: 8443)
  EdgeInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref Subnet
      PrivateIpAddress: '10.0.1.20'
      SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        - Key: Name
          Value: 'Mac2-Edge-Nginx-LB'
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y nginx openssl

          mkdir -p /etc/nginx/ssl
          cd /etc/nginx/ssl

          # Generate Self-Signed TLS Certificate with SAN for app.team1.test
          cat << 'EOF' > san.cnf
          [req]
          distinguished_name = req_dn
          x509_extensions = v3_req
          prompt = no
          [req_dn]
          CN = app.team1.test
          [v3_req]
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = app.team1.test
          DNS.2 = api.team1.test
          DNS.3 = localhost
          EOF

          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/ssl/server.key \
            -out /etc/nginx/ssl/server.crt \
            -config san.cnf

          cat << 'EOF' > /etc/nginx/conf.d/edge.conf
          upstream backend_servers {
              server 10.0.1.30:3001 max_fails=1 fail_timeout=10s;
              server 10.0.1.40:3002 max_fails=1 fail_timeout=10s;
          }

          server {
              listen 8443 ssl;
              server_name app.team1.test api.team1.test localhost;

              ssl_certificate /etc/nginx/ssl/server.crt;
              ssl_certificate_key /etc/nginx/ssl/server.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              location / {
                  proxy_pass http://backend_servers;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass_header Cache-Control;
                  proxy_pass_header ETag;
                  proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
              }
          }
          EOF

          systemctl enable --now nginx

  # Mac 1: Private DNS Server (Private IP: 10.0.1.10, Port: 53)
  DNSInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn: EdgeInstance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref Subnet
      PrivateIpAddress: '10.0.1.10'
      SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        - Key: Name
          Value: 'Mac1-Private-DNS'
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            yum update -y
            yum install -y dnsmasq curl

            # Wait for Edge Public IP to be available via AWS metadata or query
            EDGE_PUB_IP="${EdgeInstance.PublicIp}"

            cat << EOF > /etc/dnsmasq.conf
            listen-address=0.0.0.0
            port=53
            bind-interfaces
            local-ttl=30
            domain-needed
            bogus-priv

            # Resolves app.team1.test to Edge instance
            address=/app.team1.test/$EDGE_PUB_IP
            address=/api.team1.test/$EDGE_PUB_IP
            address=/team1.test/$EDGE_PUB_IP
            EOF

            systemctl enable --now dnsmasq

# =========================================================================
# 4. STACK OUTPUTS (IP Addresses and Test Commands)
# =========================================================================
Outputs:
  DNSServerPublicIP:
    Description: 'Public IP of Mac 1 (Private DNS Server)'
    Value: !GetAtt DNSInstance.PublicIp

  EdgeServerPublicIP:
    Description: 'Public IP of Mac 2 (Edge Reverse Proxy & Load Balancer)'
    Value: !GetAtt EdgeInstance.PublicIp

  BackendAPublicIP:
    Description: 'Public IP of Mac 3 (Backend Server A)'
    Value: !GetAtt BackendAInstance.PublicIp

  BackendBPublicIP:
    Description: 'Public IP of Mac 4 (Backend Server B)'
    Value: !GetAtt BackendBInstance.PublicIp

  DigTestCommand:
    Description: 'Command to test DNS resolution from your Mac'
    Value: !Sub 'dig @${DNSInstance.PublicIp} app.team1.test +short'

  CurlTestCommand:
    Description: 'Command to test HTTPS Load Balancing from your Mac'
    Value: !Sub 'curl -k -i --resolve app.team1.test:8443:${EdgeInstance.PublicIp} https://app.team1.test:8443/api/status'
